<!DOCTYPE html>
<html lang="hak-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼音注音闖關</title>
<style>
  :root { --bg:#fbf6ec; --card:#ffffff; --ink:#22304a; --sub:#6b7488; --main:#e8734a; --ok:#2e9e6b; --bad:#d64545; --line:#e7dfcf; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"GenSenRounded TW","源泉圓體 TW","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:18px 16px 40px; }
  h1 { margin:6px 0 2px; font-size:clamp(1.7rem,5vw,2.4rem); text-align:center; }
  .note { text-align:center; color:var(--sub); margin:0 0 18px; font-size:.95rem; }
  .stage { display:grid; grid-template-columns:1.1fr 1fr; gap:22px; align-items:start; }
  .levels { display:flex; flex-direction:column; gap:14px; }
  .levels .lv { width:80%; }
  .levels .lv:nth-child(odd) { align-self:flex-start; }
  .levels .lv:nth-child(even) { align-self:flex-end; }
  .levels .lv.boss { width:100%; align-self:stretch; margin-top:6px; }
  .stage .board { margin:0; max-width:none; position:sticky; top:12px; }
  @media (max-width:720px){ .stage { grid-template-columns:1fr; } .stage .board { position:static; } }
  .lv { background:var(--card); border:3px solid var(--line); border-radius:18px; padding:16px 18px; cursor:pointer; text-align:left; font:inherit; color:inherit; }
  .lv:hover, .lv:focus { border-color:var(--main); outline:none; }
  .lv b { display:block; font-size:1.25rem; margin-bottom:4px; }
  .lv span { color:var(--sub); font-size:.95rem; }
  .invite { display:flex; align-items:center; gap:14px; margin:0 0 4px; }
  .invite img { width:84px; height:84px; border-radius:50%; border:3px solid var(--main); background:#fff; flex:none; }
  .invite .say { position:relative; background:var(--card); border:3px solid var(--main); border-radius:18px; padding:10px 16px; font-size:clamp(1.05rem,3.6vw,1.3rem); font-weight:bold; }
  .invite .say::before { content:""; position:absolute; left:-14px; top:50%; margin-top:-10px; border:10px solid transparent; border-right:14px solid var(--main); border-left:0; }
  .invite .say::after { content:""; position:absolute; left:-9px; top:50%; margin-top:-7px; border:7px solid transparent; border-right:10px solid var(--card); border-left:0; }
  .board { margin:18px auto 0; max-width:520px; background:var(--card); border:3px solid var(--line); border-radius:18px; padding:14px 18px; }
  .board h3 { margin:0 0 8px; text-align:center; }
  .board ol { margin:0; padding-left:2em; font-size:1.1rem; }
  .board li { padding:3px 0; }
  .board .me { color:var(--main); font-weight:bold; }
  .join { margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .join input { font:inherit; font-size:1.1rem; padding:8px 12px; border-radius:12px; border:2px solid var(--line); width:12em; }
  .lv .best { display:block; margin-top:8px; color:var(--main); font-weight:bold; font-size:.95rem; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; font-weight:bold; }
  .pill { background:var(--card); border:2px solid var(--line); border-radius:999px; padding:6px 14px; }
  .progress { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin-bottom:16px; }
  .progress i { display:block; height:100%; background:var(--main); width:0; transition:width .3s; }
  .ask { background:var(--card); border-radius:22px; padding:22px 16px; text-align:center; border:3px solid var(--line); }
  .ask .how { color:var(--sub); font-size:1rem; }
  .ask .big { font-size:clamp(3rem,13vw,5.6rem); font-weight:bold; line-height:1.25; margin:8px 0 4px; letter-spacing:.04em; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .opt { font:inherit; font-size:clamp(1.8rem,7vw,2.8rem); font-weight:bold; padding:16px 8px; border-radius:18px; border:3px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer; min-height:86px; }
  .opt:hover:not(:disabled) { border-color:var(--main); }
  .opt.ok { background:#e5f6ee; border-color:var(--ok); color:var(--ok); }
  .opt.bad { background:#fbe9e9; border-color:var(--bad); color:var(--bad); }
  .opt:disabled { cursor:default; }
  .fb { min-height:92px; margin-top:14px; text-align:center; font-size:1.15rem; }
  .fb .res { font-weight:bold; font-size:1.35rem; }
  .fb .res.ok { color:var(--ok); } .fb .res.bad { color:var(--bad); }
  .fb .ex { margin-top:6px; }
  .fb .tip { margin-top:6px; color:var(--sub); font-size:1rem; }
  .btn { font:inherit; font-weight:bold; font-size:1.1rem; padding:10px 22px; border-radius:14px; border:0; background:var(--main); color:#fff; cursor:pointer; }
  .btn.ghost { background:var(--card); color:var(--ink); border:2px solid var(--line); }
  .snd { font:inherit; border:2px solid var(--line); background:var(--card); border-radius:999px; padding:4px 12px; cursor:pointer; margin-left:6px; }
  .row { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .end { background:var(--card); border-radius:22px; padding:22px; text-align:center; border:3px solid var(--line); }
  .end .score { font-size:3rem; font-weight:bold; color:var(--main); }
  .miss { text-align:left; margin:14px auto 0; max-width:520px; }
  .miss div { padding:8px 4px; border-bottom:1px dashed var(--line); font-size:1.15rem; }
  .lv.boss { background:linear-gradient(135deg,#1b1326,#3a1530); border:3px solid #ffc83d; color:#f6efff; padding:20px 22px; box-shadow:0 6px 0 #b3202e; }
  .lv.boss:hover, .lv.boss:focus { border-color:#ff4d5a; }
  .lv.boss b { font-size:1.6rem; color:#ffc83d; letter-spacing:.12em; }
  .lv.boss span { color:#d9cdee; }
  .lv.boss .best { color:#ffc83d; }
  .board.boss { background:#fff8e3; border:6px double #c9972b; border-radius:6px; color:#5a2a12; padding:16px 20px 18px; box-shadow:inset 0 0 0 3px #fff8e3, inset 0 0 0 4px #b3202e; }
  .board.boss h3 { color:#9b1c1c; font-size:1.25rem; letter-spacing:.12em; padding-bottom:8px; border-bottom:2px solid #c9972b; }
  .board.boss ol { list-style:none; padding:0; margin:6px 0 0; }
  .board.boss li { display:flex; align-items:center; gap:12px; padding:5px 8px; min-height:2.7em; border-bottom:1px dashed #d9b866; }
  .board.boss .no { flex:none; width:2em; height:2em; line-height:2em; border-radius:50%; text-align:center; background:#f0e0b0; color:#7a4a12; font-size:.95rem; }
  .board.boss .nm { flex:1; }
  .board.boss .sc { color:#7a4a12; font-size:.95rem; }
  .board.boss li.r1 { font-size:1.25rem; font-weight:bold; background:#fdeeb8; }
  .board.boss li.r1 .no { background:#d9a521; color:#fff; }
  .board.boss li.r2 .no { background:#a9b3c2; color:#fff; }
  .board.boss li.r3 .no { background:#c97b3c; color:#fff; }
  .board.boss li.me { outline:2px solid #b3202e; border-radius:6px; }
  body.boss { --bg:#150f1e; --card:#241b33; --ink:#f6efff; --sub:#b3a6cc; --main:#ff4d5a; --line:#3d2f57; --ok:#4fd699; --bad:#ff7a85; }
  body.boss .opt.ok { background:#12382b; }
  body.boss .opt.bad { background:#431a22; }
  body.boss .end .score, body.boss .progress i { color:#ffc83d; }
  body.boss .progress i { background:#ffc83d; }
  body.boss .join input { background:#150f1e; color:var(--ink); border-color:#ffc83d; }
  body.boss .btn { background:#ff4d5a; color:#fff; }
  body.boss .btn.ghost { background:var(--card); color:var(--ink); }
  .hidden { display:none !important; }
  @media (max-width:420px){ .opts { gap:8px; } .opt { min-height:74px; } }
</style>
</head>

const 排行榜網址 = "https://script.google.com/macros/s/AKfycbzPdUYTCwEZYKd_ZxNAhWHmdM24_DcMve3k2eZjr4PTJ6r893IKSijvcBDBkVjplm2yWA/exec";
async function 讀榜(){ if (!排行榜網址) return null; try { const r = await fetch(排行榜網址 + "?action=list"); return await r.json(); } catch (e) { return null; } }
function 榜HTML(榜, 我){
  const 是我 = x => 我 && x.名 === 我.名 && x.對 === 我.對 && Math.abs(x.秒 - 我.秒) < 0.6;
  const 列 = Array.from({length:10}, (_, i) => { const x = (榜 || [])[i];
    return x ? `<li class="r${i+1} ${是我(x) ? "me" : ""}"><b class="no">${i+1}</b><span class="nm">${x.名.replace(/[<>&]/g,"")}</span><span class="sc">${x.對}/20　${秒字(x.秒)}</span></li>`
             : `<li class="r${i+1}"><b class="no">${i+1}</b><span class="nm"></span><span class="sc"></span></li>`; }).join("");
  return `<div class="board boss"><h3>👑 魔王關排行榜（前十名）</h3><ol>${列}</ol></div>`;
}
function 排前(a, b){ return b.對 - a.對 || a.秒 - b.秒; }
// 首頁直接顯示前十名(教師 2026-10-25:學生一打開遊戲就看得到)
async function 首頁排行(){ $("homerank").innerHTML = 榜HTML([]); if (!排行榜網址) return; const 榜 = await 讀榜(); if (榜) $("homerank").innerHTML = 榜HTML(榜); }
async function 顯示排行(對, 秒){
  const 區 = $("rank"); 區.innerHTML = ""; if (!排行榜網址) return;
  let 榜 = await 讀榜(); if (!榜) { 區.innerHTML = '<div class="board" style="text-align:center;color:var(--sub)">排行榜暫時連不上。</div>'; return; }
  const 能上榜 = 對 > 0 && (榜.length < 10 || 排前({對, 秒}, 榜[榜.length-1]) < 0);
  區.innerHTML = 榜HTML(榜) + (能上榜 ? `<div class="join"><input id="nick" maxlength="10" placeholder="輸入暱稱（毋好寫真名）"><button class="btn" id="send">上榜</button></div>` : "");
  if (能上榜) $("send").onclick = async () => {
    const 名 = $("nick").value.trim().slice(0, 10); if (!名) { $("nick").focus(); return; }
    $("send").disabled = true; $("send").textContent = "送出中…";
    try { const r = await fetch(`${排行榜網址}?action=add&name=${encodeURIComponent(名)}&correct=${對}&sec=${秒.toFixed(1)}`); const 回 = await r.json();
      if (回 && 回.錯) { $("send").disabled = false; $("send").textContent = "上榜"; $("nick").value = ""; $("nick").placeholder = "這個暱稱毋好用，請換一個"; $("nick").focus(); return; }
      榜 = 回; } catch (e) {}
    區.innerHTML = 榜HTML(榜, {名, 對, 秒: +秒.toFixed(1)});
  };
}
let 最佳 = {}; try { 最佳 = JSON.parse(localStorage.getItem(記錄鍵) || "{}"); } catch (e) {}
const $ = id => document.getElementById(id);
let 現 = null, 題目 = [], 第 = 0, 對 = 0, 開始時 = 0, 計時器 = null, 錯 = [];

function 亂(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function 秒字(s){ s=Math.round(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function 像(a,b){ let n=0; for (const ch of a) if (b.includes(ch)) n++; return n - Math.abs(a.length-b.length)*0.5; }

function 畫關卡(){
  $("levels").innerHTML = "";
  for (const L of 關卡) {
    const b = document.createElement("button"); b.className = "lv" + (L.id === "挑戰" ? " boss" : "");
    const r = 最佳[L.id];
    b.innerHTML = `<b>${L.名}</b><span>${L.說}</span>` + (r ? `<span class="best">最好：${r.對}/${L.數} ・ ${秒字(r.秒)}</span>` : "");
    b.onclick = () => 開始(L); $("levels").appendChild(b);
  }
}
function 開始(L){

  現 = L; 題目 = 亂(L.題()).slice(0, L.數).map(x => ({...x, 反: Math.random() < 0.5}));
  第 = 0; 對 = 0; 錯 = []; 開始時 = Date.now();
  $("home").classList.add("hidden"); $("done").classList.add("hidden"); $("play").classList.remove("hidden");
  $("lvname").textContent = L.名;
  clearInterval(計時器); 計時器 = setInterval(() => $("clock").textContent = 秒字((Date.now()-開始時)/1000), 250);
  出題();
}
function 選項(q){
  const 池 = 現.id === "挑戰" ? [...題庫.聲母,...題庫.單韻母,...題庫.結合韻,...題庫.音節] : 現.題();
  const 同類 = 池.filter(x => x.拼 !== q.拼);
  const key = q.反 ? "拼" : "注";
  const 對答 = q[key];
  let 錯答 = [];
  if (!q.反 && 陷阱[q.拼]) 錯答.push(...陷阱[q.拼]);
  const 依像 = 同類.map(x => [x, 像(q[key], x[key]) + Math.random()*1.2]).sort((a,b)=>b[1]-a[1]).map(a=>a[0][key]);
  for (const v of 依像) { if (錯答.length >= 3) break; if (v !== 對答 && !錯答.includes(v)) 錯答.push(v); }
  return 亂([對答, ...錯答.slice(0,3)]);
}
function 出題(){
  const q = 題目[第];
  $("prog").style.width = (第/題目.length*100) + "%";
  $("how").textContent = q.反 ? "這隻注音，拼音係？" : "這隻拼音，注音係？";
  $("big").textContent = q.反 ? q.注 : q.拼;
  $("fb").innerHTML = ""; $("next").classList.add("hidden");
  $("opts").innerHTML = "";
  for (const v of 選項(q)) {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = v;
    b.onclick = () => 作答(b, v, q); $("opts").appendChild(b);
  }
}
function 播(syl){ if (!(syl in 音檔)) return; try { new Audio(音檔[syl]).play(); } catch (e) {} }
function 作答(b, v, q){
  const 答案 = q.反 ? q.拼 : q.注;
  const 正 = v === 答案;
  for (const o of $("opts").children) { o.disabled = true; if (o.textContent === 答案) o.classList.add("ok"); }
  if (!正) { b.classList.add("bad"); 錯.push(q); } else 對++;
  $("score").textContent = 對;
  const 例 = q.例 ? `例：<b>${q.字 || ""}</b>　${q.讀 || q.例}` + ((q.例 in 音檔) ? `<button class="snd" onclick="播('${q.例}')">🔊 再聽一擺</button>` : "") : "";
  $("fb").innerHTML = `<div class="res ${正?"ok":"bad"}">${正 ? "✔ 著咧！" : "✘ 正確答案"}　${q.拼} ＝ ${q.注}</div>`
    + `<div class="ex">${例}</div>` + (!正 && 提示[q.拼] ? `<div class="tip">${提示[q.拼]}</div>` : "");
  if (q.例) 播(q.例);
  if (現.id === "挑戰" && 正) setTimeout(下一題, 900); else $("next").classList.remove("hidden");
}
function 下一題(){ 第++; if (第 >= 題目.length) 結束(); else 出題(); }
function 結束(){
  $("rank").innerHTML = "";
  clearInterval(計時器);
  const 秒 = (Date.now()-開始時)/1000;
  $("play").classList.add("hidden"); $("done").classList.remove("hidden");
  $("endtitle").textContent = 現.名;
  $("endscore").textContent = `${對} / ${題目.length}`;
  $("endtime").textContent = "用咧 " + 秒字(秒) + (現.目標 ? `（目標 ${秒字(現.目標)}）` : "");
  const 舊 = 最佳[現.id];
  if (!舊 || 對 > 舊.對 || (對 === 舊.對 && 秒 < 舊.秒)) {
    最佳[現.id] = {對, 秒}; try { localStorage.setItem(記錄鍵, JSON.stringify(最佳)); } catch (e) {}
    $("endbest").textContent = "🏆 新紀錄！";
  } else $("endbest").textContent = `最好紀錄：${舊.對}/${題目.length} ・ ${秒字(舊.秒)}`;
  if (現.目標 && 對 === 題目.length && 秒 <= 現.目標) $("endbest").textContent += "　🎯 挑戰成功！";
  if (現.id === "挑戰") 顯示排行(對, 秒);
  $("miss").innerHTML = 錯.length ? "<b>再看一下：</b>" + 錯.map(q => `<div>${q.拼} ＝ ${q.注}　${q.例 ? "例：" + (q.字||"") + " " + (q.讀||q.例) : ""}${(q.例 in 音檔) ? ` <button class="snd" onclick="播('${q.例}')">🔊</button>` : ""}</div>`).join("") : "";
}
$("next").onclick = 下一題;
$("quit").onclick = $("back").onclick = () => { document.body.classList.remove("boss"); clearInterval(計時器); $("play").classList.add("hidden"); $("done").classList.add("hidden"); $("home").classList.remove("hidden"); 畫關卡(); 首頁排行(); };
$("again").onclick = () => 開始(現);
document.addEventListener("keydown", e => { if (e.key === "Enter" && !$("next").classList.contains("hidden")) 下一題(); });
畫關卡();
首頁排行();
</script>
</body>
